name: Build Caddy Binary

on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GOOS: "linux"
  GOARCH: "amd64"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set current date env
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with modules
        run: |
          ~/go/bin/xcaddy build \
            --output ./caddy-acid \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/mholt/caddy-ratelimit

      - name: Extract Caddy Version
        run: |
          REAL_VER=$(./caddy-acid version | awk '{print $1}')
          echo "CADDY_VER=$REAL_VER" >> $GITHUB_ENV

      - name: Pack binary
        run: tar -czvf caddy-linux-amd64.tar.gz caddy-acid

      - name: Publish to GitHub Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Создаем постоянный релиз с тегом даты
          # Очищаем старый тег текущего дня, если workflow запускается повторно вручную
          gh release delete "${{ env.RELEASE_DATE }}" --yes || true
          git tag -d "${{ env.RELEASE_DATE }}" || true
          git push origin :refs/tags/"${{ env.RELEASE_DATE }}" || true

          gh release create "${{ env.RELEASE_DATE }}" caddy-linux-amd64.tar.gz \
            --title "Release ${{ env.RELEASE_DATE }} (${{ env.CADDY_VER }})" \
            --notes "Automatic build ${{ env.RELEASE_DATE }} version ${{ env.CADDY_VER }}" \
            --target main

          # 2. Обновляем плавающий релиз 'latest'
          gh release delete latest --yes || true
          git tag -d latest || true
          git push origin :refs/tags/latest || true

          gh release create latest caddy-linux-amd64.tar.gz \
            --title "Latest Build ${{ env.RELEASE_DATE }} (${{ env.CADDY_VER }})" \
            --notes "Latest build ${{ env.RELEASE_DATE }} version ${{ env.CADDY_VER }}" \
            --target main