name: Build Caddy Binary

on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GOOS: "linux"
  GOARCH: "amd64"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set current date env
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with modules
        run: |
          ~/go/bin/xcaddy build \
            --output ./caddy-acid \
            --with github.com/caddy-dns/cloudflare \
            --with github.com/mholt/caddy-l4 \
            --with github.com/pberkel/caddy-storage-redis \
            --with github.com/caddyserver/transform-encoder \
            --with github.com/hslatman/caddy-crowdsec-bouncer/http@main \
            --with github.com/hslatman/caddy-crowdsec-bouncer/layer4@main \
            --with github.com/evaneonf/caddy-anytls

      - name: Extract Caddy Version
        run: |
          CADDY_VER=$(./caddy-acid version | awk '{print $1}')
          DEB_VER=$(echo "$CADDY_VER" | sed 's/^v//')
          echo "CADDY_VER=$CADDY_VER" >> $GITHUB_ENV
          echo "DEB_VER=$DEB_VER" >> $GITHUB_ENV

      - name: Build Debian (.deb) Package
        run: |
          mkdir -p deb-root/DEBIAN
          mkdir -p deb-root/usr/bin
          mkdir -p deb-root/etc/caddy
          mkdir -p deb-root/lib/systemd/system
          mkdir -p deb-root/usr/share/bash-completion/completions
          mkdir -p deb-root/var/lib/caddy
          mkdir -p deb-root/var/www/html

          cp ./caddy-acid deb-root/usr/bin/caddy-acid
          chmod 755 deb-root/usr/bin/caddy-acid

          cp ./Caddyfile deb-root/etc/caddy/Caddyfile
          cp ./caddy.service deb-root/lib/systemd/system/caddy.service
          cp ./index.html deb-root/var/www/html/index.html

          ./caddy-acid completion bash > deb-root/usr/share/bash-completion/completions/caddy

          echo "/etc/caddy/Caddyfile" > deb-root/DEBIAN/conffiles
          echo "/var/www/html/index.html" >> deb-root/DEBIAN/conffiles

          cat << 'EOF' > deb-root/DEBIAN/postinst
          #!/bin/sh
          set -e
          
          if [ "$1" = "configure" ]; then
              # Add user and group
              if ! getent group caddy >/dev/null; then
                  groupadd --system caddy
              fi
              if ! getent passwd caddy >/dev/null; then
                  useradd --system \
                      --gid caddy \
                      --create-home \
                      --home-dir /var/lib/caddy \
                      --shell /usr/sbin/nologin \
                      --comment "Caddy web server" \
                      caddy
              fi
              if getent group www-data >/dev/null; then
                  usermod -aG www-data caddy
              fi
          
                  # handle cases where package was installed and then purged;
                  # user and group will still exist but with no home dir
                  if [ ! -d /var/lib/caddy ]; then
                          mkdir -p /var/lib/caddy
                          chown caddy:caddy /var/lib/caddy
                  fi
          
              # Add log directory with correct permissions
              if [ ! -d /var/log/caddy ]; then
                  mkdir -p /var/log/caddy
                  chown caddy:caddy /var/log/caddy
              fi
          fi
          
          if [ "$1" = "configure" ] || [ "$1" = "abort-upgrade" ] || [ "$1" = "abort-deconfigure" ] || [ "$1" = "abort-remove" ] ; then
              # This will only remove masks created by d-s-h on package removal.
              deb-systemd-helper unmask caddy.service >/dev/null || true
          
              # was-enabled defaults to true, so new installations run enable.
              if deb-systemd-helper --quiet was-enabled caddy.service; then
                  # Enables the unit on first installation, creates new
                  # symlinks on upgrades if the unit file has changed.
                  deb-systemd-helper enable caddy.service >/dev/null || true
                  deb-systemd-invoke start caddy.service >/dev/null || true
              else
                  # Update the statefile to add new symlinks (if any), which need to be
                  # cleaned up on purge. Also remove old symlinks.
                  deb-systemd-helper update-state caddy.service >/dev/null || true
              fi
          
              # Restart only if it was already started
              if [ -d /run/systemd/system ]; then
                  systemctl --system daemon-reload >/dev/null || true
                  if [ -n "$2" ]; then
                      deb-systemd-invoke try-restart caddy.service >/dev/null || true
                  fi
              fi
          fi
          EOF
          chmod 755 deb-root/DEBIAN/postinst

          cat <<EOF > deb-root/DEBIAN/control
          Package: caddy-acid
          Version: ${{ env.DEB_VER }}~${{ env.RELEASE_DATE }}
          Architecture: amd64
          Maintainer: 0urr-acid
          Depends: bash-completion, passwd
          Section: net
          Priority: optional
          Description: Caddy build
          EOF

          cat <<EOF > deb-root/DEBIAN/postrm
          #!/bin/sh
          set -e
          
          if [ -d /run/systemd/system ]; then
              systemctl --system daemon-reload >/dev/null || true
          fi
          
          if [ "$1" = "remove" ]; then
              if [ -x "/usr/bin/deb-systemd-helper" ]; then
                  deb-systemd-helper mask caddy.service >/dev/null || true
              fi
          fi
          
          if [ "$1" = "purge" ]; then
              if [ -x "/usr/bin/deb-systemd-helper" ]; then
                  deb-systemd-helper purge caddy.service >/dev/null || true
                  deb-systemd-helper unmask caddy.service >/dev/null || true
              fi
              # 'purge' is not supposed to leave package files behind,
              # so remove the user along with other dirs.
              userdel -r caddy || true
              rm -rf /var/lib/caddy /var/log/caddy /etc/caddy
          fi
          EOF
          chmod 755 deb-root/DEBIAN/postrm


          cat <<EOF > deb-root/DEBIAN/prerm
          #!/bin/sh
          set -e
          
          if [ -d /run/systemd/system ] && [ "$1" = remove ]; then
              deb-systemd-invoke stop caddy.service >/dev/null || true
          fi
          EOF
          chmod 755 deb-root/DEBIAN/prerm
          
          (cd deb-root && find . -type f ! -path './DEBIAN/*' -exec md5sum {} + | sed 's|^\./||' > DEBIAN/md5sums)
          chmod 644 deb-root/DEBIAN/md5sums

          dpkg-deb --build deb-root "caddy-acid_${{ env.DEB_VER }}~${{ env.RELEASE_DATE }}_amd64.deb"
          cp "caddy-acid_${{ env.DEB_VER }}~${{ env.RELEASE_DATE }}_amd64.deb" caddy-acid-latest.deb

      - name: Publish to GitHub Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.RELEASE_DATE }}" --yes || true
          git tag -d "${{ env.RELEASE_DATE }}" || true
          git push origin :refs/tags/"${{ env.RELEASE_DATE }}" || true

          gh release create "${{ env.RELEASE_DATE }}" "caddy-acid_${{ env.DEB_VER }}~${{ env.RELEASE_DATE }}_amd64.deb" \
            --title "Release ${{ env.RELEASE_DATE }} (${{ env.CADDY_VER }})" \
            --notes "Automatic build ${{ env.RELEASE_DATE }} version ${{ env.CADDY_VER }}" \
            --target main

          gh release delete latest --yes || true
          git tag -d latest || true
          git push origin :refs/tags/latest || true

          gh release create latest caddy-acid-latest.deb \
            --title "Latest Build ${{ env.RELEASE_DATE }} (${{ env.CADDY_VER }})" \
            --notes "Latest build ${{ env.RELEASE_DATE }} version ${{ env.CADDY_VER }}" \
            --target main